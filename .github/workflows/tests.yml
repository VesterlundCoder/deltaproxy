name: corrected-regression-tests

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile cmf_generic.py spectral_delta.py proxy_batch.py benchmark_proxy_vs_exact.py validation_precision.py gpu_proxy/proxy_kernel.py gpu_proxy/gpu_sweep.py
